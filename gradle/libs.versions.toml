[versions]
agp = "9.4.1"
coreKtx = "1.16.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
room = "2.8.5"
ksp = "2.3.10"
roomCommon = "2.8.5"
coroutinesTest = "1.11.0"
lifecycleRuntimeCompose = "2.6.1"
appcompat = "1.8.0"
